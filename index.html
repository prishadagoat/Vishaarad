<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verse Memorizer</title>
<style>
  :root {
    --bg: #faf8f4;
    --card-bg: #ffffff;
    --text-primary: #23201b;
    --text-secondary: #6b6255;
    --text-muted: #a89f8f;
    --accent: #a8552c;
    --accent-dark: #8a4322;
    --border: #e8e1d4;
    --danger: #b5433a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  .wrap {
    width: 100%;
    max-width: 640px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    font-weight: 600;
  }
  .subtitle {
    color: var(--text-secondary);
    font-size: 14px;
    margin: 0 0 24px;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  textarea {
    width: 100%;
    resize: vertical;
    font-family: inherit;
    font-size: 15px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: #fdfcfa;
    color: var(--text-primary);
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    border: none;
    border-radius: 10px;
    padding: 10px 18px;
    cursor: pointer;
    background: var(--accent);
    color: white;
    transition: background 0.15s ease, opacity 0.15s ease;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.secondary {
    background: transparent;
    color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: #f3efe7; color: var(--text-primary); }
  .error-text {
    font-size: 13px;
    color: var(--danger);
    margin: 10px 0 0;
    display: none;
  }
  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 8px;
  }
  .counter { font-size: 13px; color: var(--text-muted); }
  #word-stage {
    min-height: 110px;
    padding: 2rem 0.25rem;
    font-size: 21px;
    line-height: 1.8;
    cursor: pointer;
    user-select: none;
    border-radius: 10px;
  }
  #word-stage:focus { outline: 2px solid var(--accent); outline-offset: 4px; }
  .word-hidden { color: var(--text-muted); }
  .word-shown { color: var(--text-primary); font-weight: 500; }
  .controls {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    margin-top: 8px;
  }
  .progress { font-size: 13px; color: var(--text-muted); margin-left: 2px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px;
    overflow: hidden; clip: rect(0,0,0,0);
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Vishaarad Study Tool</h1>
  <p class="subtitle">Click to reveal one word at a time, until the shloka is over. </p>

  <div class="card">
    <div id="setup-view">
      <p style="font-size: 14px; color: var(--text-secondary); margin: 0 0 8px;">Edit the text below if you'd like, or just hit start.</p>
      <textarea id="lines-input" rows="10"></textarea>
      <div style="margin-top: 14px;">
        <button id="start-btn">▶ Start</button>
      </div>
      <p id="setup-error" class="error-text">Enter at least one line first.</p>
    </div>

    <div id="practice-view" style="display: none;">
      <div class="top-row">
        <span id="line-counter" class="counter"></span>
        <button id="restart-btn" class="secondary" style="font-size: 13px; padding: 5px 12px;">✎ Edit text</button>
      </div>

      <div id="word-stage" tabindex="0" role="button" aria-label="Click to reveal the next word"></div>

      <div class="controls">
        <button id="prev-line-btn" class="secondary" title="Previous quote">←</button>
        <button id="reveal-btn">Reveal next word</button>
        <button id="line-done-btn" style="display: none;">Next quote →</button>
        <span id="progress-text" class="progress"></span>
      </div>
    </div>
  </div>

  <footer>Click the word area, or the button, to reveal the next word.</footer>
</div>

hoy to te ṭaḷī jāy, paṇ shraddhā na hoy ne
foshī hoy tethī e swabhāv ṭaḷe nahī.

Jene niṣhkāmī vartamān draḍh hoy to te
thakī ame hajār gāu chheṭe jaīe to paṇ
tenī pāse ja chhīe; ane jene te niṣhkāmī
vartamānmā kāchyap chhe ne te jo amārī
pāse rahe chhe toy paṇ te lākh gāu chheṭe
chhe. Ane amane niṣhkāmī bhakta hoy
tenā ja hāthnī karī sevā game chhe.

Māhātmya-gnān-yukt bhakti tav, ekāntik sukhḍhām. 1
Mohime tav bhaktapano, tāme koī prakār;
Dosh na rahe koī jātko, suniyo Dharmakumār. 2

Bhagwān āpaṇne hāthīe besāḍe to hāthīe
besīne rājī rahevu ane gadheḍe besāḍe
to gadheḍe besīne rājī rahevu… e Bhagwānnu karyu sarve thāy chhe.  Māṭe sūku pānaḍu jem vāyune ādhāre fare tem e Bhagwānne ādhīn rahīne ānandmā
e Parameshvarnu bhajan karavu ane koī

(Vachanamrut Gadhada I – 74)

Jo mār mār karato koī āvato hoy to em

ne hāth kanṭhanī rakṣhā kare chhe ne
māvatar chhokarānī rakṣhā kare chhe

Bhagwānnī ichchhāe karīne game tevu

Dāsnā dushman Hari ke'dī hoy nahi,

(Swamini Vato: 1/148)

(Dhiraj Akhyan – 1/8)`;

let lines = [];
let currentLine = 0;
let revealedCount = 0;

const setupView = document.getElementById('setup-view');
const practiceView = document.getElementById('practice-view');
const linesInput = document.getElementById('lines-input');
const startBtn = document.getElementById('start-btn');
const setupError = document.getElementById('setup-error');
const wordStage = document.getElementById('word-stage');
const revealBtn = document.getElementById('reveal-btn');
const lineDoneBtn = document.getElementById('line-done-btn');
const restartBtn = document.getElementById('restart-btn');
const prevLineBtn = document.getElementById('prev-line-btn');
const lineCounter = document.getElementById('line-counter');
const progressText = document.getElementById('progress-text');

linesInput.value = PRELOADED_TEXT;

function isFullyParen(line) {
  return /^\(.*\)$/.test(line);
}

function groupIntoQuotes(rawText) {
  const rawLines = rawText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
  const blocks = [];
  let buffer = [];
  let inTrailer = false;
  for (const line of rawLines) {
    if (buffer.length === 0) {
      buffer.push(line);
      inTrailer = isFullyParen(line);
      continue;
    }
    if (inTrailer) {
      if (isFullyParen(line)) {
        buffer.push(line);
      } else {
        blocks.push(buffer.join(' '));
        buffer = [line];
        inTrailer = isFullyParen(line);
      }
    } else {
      buffer.push(line);
      if (isFullyParen(line)) inTrailer = true;
    }
  }
  if (buffer.length > 0) blocks.push(buffer.join(' '));
  return blocks;
}

function startPractice() {
  const grouped = groupIntoQuotes(linesInput.value);
  if (grouped.length === 0) {
    setupError.style.display = 'block';
    return;
  }
  setupError.style.display = 'none';
  lines = grouped;
  currentLine = 0;
  revealedCount = 0;
  setupView.style.display = 'none';
  practiceView.style.display = 'block';
  renderLine();
}

function getWords() {
  return lines[currentLine].split(' ').filter(w => w.length > 0);
}

function renderLine() {
  const words = getWords();
  lineCounter.textContent = 'Quote ' + (currentLine + 1) + ' of ' + lines.length;
  wordStage.innerHTML = words.map((w, i) => {
    if (i < revealedCount) {
      return '<span class="word-shown">' + escapeHtml(w) + '</span>';
    }
    return '<span class="word-hidden">•••</span>';
  }).join(' ');
  const done = revealedCount >= words.length;
  revealBtn.style.display = done ? 'none' : 'inline-flex';
  lineDoneBtn.style.display = done ? 'inline-flex' : 'none';
  lineDoneBtn.textContent = (currentLine === lines.length - 1) ? 'Restart from quote 1' : 'Next quote →';
  progressText.textContent = revealedCount + ' / ' + words.length + ' words';
  prevLineBtn.disabled = currentLine === 0;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function revealNext() {
  const words = getWords();
  if (revealedCount < words.length) {
    revealedCount++;
    renderLine();
  }
}

function nextLine() {
  if (currentLine < lines.length - 1) {
    currentLine++;
    revealedCount = 0;
    renderLine();
  } else {
    currentLine = 0;
    revealedCount = 0;
    renderLine();
  }
}

function prevLine() {
  if (currentLine > 0) {
    currentLine--;
    revealedCount = 0;
    renderLine();
  }
}

startBtn.addEventListener('click', startPractice);
wordStage.addEventListener('click', revealNext);
wordStage.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') {
    e.preventDefault();
    revealNext();
  }
});
revealBtn.addEventListener('click', revealNext);
lineDoneBtn.addEventListener('click', nextLine);
prevLineBtn.addEventListener('click', prevLine);
restartBtn.addEventListener('click', () => {
  setupView.style.display = 'block';
  practiceView.style.display = 'none';
});
</script>
